<div class="forgot-page">
  <div class="forgot-container">
    <div class="forgot-card">
      <h2>Forgot Password</h2>

      <p class="subtitle">
        Enter your registered email address and we'll send you a password reset link.
      </p>

      <form [formGroup]="forgotForm" (ngSubmit)="sendResetLink()">
        <!-- Account Recovery -->

        <div class="section-title">
          <i class="bi bi-envelope-lock-fill"></i>

          <span>Account Recovery</span>
        </div>

        <div class="form-group">
          <label class="form-label">
            <div class="label-row">
              <span>Email Address</span>

              <span class="required">*</span>
            </div>

            <small class="helper-text"> Registered Email Address </small>
          </label>

          <div class="input-wrapper">
            <i class="bi bi-envelope-fill"></i>

            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="Enter your email"
            />
          </div>

          @if ((submitted || f['email'].touched) && f['email'].errors) {
            <small class="error"> Please enter a valid email address. </small>
          }
        </div>

        <div class="button-row">
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            <i class="bi bi-send-fill me-2"></i>

            {{ loading ? 'Sending...' : 'Send Reset Link' }}
          </button>

          <button type="button" class="btn btn-danger" (click)="cancel()">
            <i class="bi bi-x-circle me-2"></i>

            Cancel
          </button>
        </div>

        <div class="bottom-links">
          <div class="link-row">
            <span>Remember your password?</span>

            <a routerLink="/login" class="btn btn-outline-primary">
              <i class="bi bi-box-arrow-in-right me-2"></i>

              Login
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
