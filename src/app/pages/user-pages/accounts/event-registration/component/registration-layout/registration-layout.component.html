<div class="registration-page">
  <!-- ================================= -->
  <!-- EVENT HEADER -->
  <!-- ================================= -->

  <header class="registration-header">
    <div class="header-container">
      <div class="event-info">
        <span class="event-eyebrow"> EVENT REGISTRATION </span>

        <h1>
          {{ event?.name || 'Event Registration' }}
        </h1>

        @if (event?.description) {
          <p class="event-description" [innerHTML]="event.description"></p>
        }
      </div>
    </div>
  </header>

  <!-- ================================= -->
  <!-- STEPPER -->
  <!-- ================================= -->

  <app-registration-stepper [steps]="steps" [activeIndex]="activeIndex"> </app-registration-stepper>

  <!-- ================================= -->
  <!-- CURRENT STEP CONTENT -->
  <!-- ================================= -->

  <main class="registration-main">
    <div class="registration-container">
      <ng-content></ng-content>
    </div>
  </main>

  <!-- ================================= -->
  <!-- NAVIGATION -->
  <!-- ================================= -->

  <footer class="registration-navigation">
    <div class="navigation-container">
      <!-- BACK -->

      @if (!isFirstStep) {
        <button type="button" class="navigation-btn back-btn" (click)="onBack()">
          <span class="material-icons"> arrow_back </span>

          <span> Back </span>
        </button>
      } @else {
        <!-- Keeps Next aligned to the right -->

        <div class="navigation-placeholder"></div>
      }

      <!-- NEXT -->

      @if (!isLastStep) {
        <button
          type="button"
          class="navigation-btn next-btn"
          [disabled]="!canContinue"
          (click)="onNext()"
        >
          <span> Next </span>

          <span class="material-icons"> arrow_forward </span>
        </button>
      }
    </div>
  </footer>
</div>
