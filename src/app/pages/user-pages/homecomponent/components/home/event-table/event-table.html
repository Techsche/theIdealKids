<mat-card class="event-card">
  <mat-card-header>
    <mat-card-title>
      <mat-icon>event</mat-icon>
      Upcoming Events
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (isLoading()) {
      <div class="empty-state">
        <mat-icon>hourglass_empty</mat-icon>
        <h3>Loading Events...</h3>
      </div>
    } @else if (events().length === 0) {
      <div class="empty-state">
        <mat-icon>event_busy</mat-icon>
        <h3>No Upcoming Events</h3>
        <p>Please check back later.</p>
      </div>
    } @else {
      <div class="table-wrapper">
        <table mat-table [dataSource]="events()" class="custom-table mat-elevation-z1">
          <!-- Event -->

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Event Name</th>

            <td mat-cell *matCellDef="let event" data-label="Event">
              {{ event.name }}
            </td>
          </ng-container>

          <!-- Date -->

          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Date</th>

            <td mat-cell *matCellDef="let event" data-label="Date">
              {{ event.start_date | date: 'dd MMM yyyy' }}
            </td>
          </ng-container>

          <!-- Register -->

          <ng-container matColumnDef="link">
            <th mat-header-cell *matHeaderCellDef>Register</th>

            <td mat-cell *matCellDef="let event" data-label="Register">
              <a mat-flat-button color="primary" [routerLink]="['/event', event.id]"> Register </a>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>

          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    }
  </mat-card-content>
</mat-card>
