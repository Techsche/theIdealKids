@if (isLoading()) {
  <div class="table-card loading-card">
    <div class="table-loader">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>

      <span>Loading events...</span>
    </div>
  </div>
} @else {
  <div class="table-card">
    <div class="table-responsive">
      <table mat-table [dataSource]="events()" class="custom-table">
        <!-- Event Name -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Event Name</th>

          <td mat-cell *matCellDef="let event" data-label="Event">
            {{ event.name }}
          </td>
        </ng-container>

        <!-- Date -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>

          <td mat-cell *matCellDef="let event" data-label="Date">
            {{ event.start_date | date: 'dd MMM yyyy' }}
          </td>
        </ng-container>

        <!-- Register -->
        <ng-container matColumnDef="link">
          <th mat-header-cell *matHeaderCellDef>Register</th>

          <td mat-cell *matCellDef="let event" data-label="Register">
            <a mat-flat-button color="primary" [routerLink]="['/event', event.id]"> Register </a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>
}
