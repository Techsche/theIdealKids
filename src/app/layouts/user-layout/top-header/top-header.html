<mat-toolbar class="top-header">
  <!-- Left -->
  <div class="left">
    <span class="tax-id">Tax ID: {{ taxNumber }}</span>
  </div>

  <span class="spacer"></span>

  <!-- Right -->
  <div class="right">
    <!-- Facebook -->
    <a href="https://www.facebook.com/theidealkids" target="_blank" rel="noopener">
      <button mat-icon-button aria-label="Facebook">
        <i class="fab fa-facebook-f fb"></i>
      </button>
    </a>
    <!-- Twitter X -->
    <a href="https://twitter.com/the_ideal_kids" target="_blank" rel="noopener">
      <button mat-icon-button aria-label="Twitter X">
        <i class="fab fa-x-twitter tw"></i>
      </button>
    </a>
    <!-- Donate -->
    <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
      <input type="hidden" name="cmd" value="_s-xclick" />
      <input type="hidden" name="hosted_button_id" value="AUKRPQK5HPJ3G" />

      <button mat-raised-button class="donate-btn" type="submit">Donate</button>
    </form>
  </div>
</mat-toolbar>
