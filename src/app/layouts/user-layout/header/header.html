<mat-toolbar class="main-header">
  <!-- Logo -->
  <div class="logo">
    <a [routerLink]="'/home'">
      <img src="assets/images/logo.png" alt="The Ideal Kids Logo" />
    </a>
  </div>

  <!-- Hamburger -->
  <button mat-icon-button class="menu-toggle" (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Center Menu -->
  <nav class="nav-menu">
    <a mat-button>About Us</a>
    <a mat-button>Events</a>
    <a mat-button>Ideal Tips</a>
    <a mat-button>Forms</a>

    <!-- Mobile Actions -->
    <div class="mobile-actions">
      @if (!isLoggedIn) {
        <button mat-button>Login</button>
        <button mat-button>Signup</button>
        <button mat-raised-button color="primary">High School Volunteer Signup</button>
      }
    </div>
  </nav>

  <!-- Right Section (Desktop) -->
  <div class="right-section">
    @if (!isLoggedIn) {
      <button mat-button>Login</button>
      <button mat-button>Signup</button>

      <button mat-raised-button color="primary">High School Volunteer Signup</button>
    }

    @if (isLoggedIn) {
      <button mat-icon-button [matMenuTriggerFor]="profileMenu">
        <img src="assets/images/user.png" class="profile-img" />
      </button>

      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item>Profile</button>
        <button mat-menu-item>Events</button>
        <button mat-menu-item>Competitions</button>
        <button mat-menu-item>Logout</button>
      </mat-menu>
    }
  </div>
</mat-toolbar>
