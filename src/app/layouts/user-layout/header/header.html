<mat-toolbar class="main-header">
  <!-- Logo -->
  <div class="logo">
    <a [routerLink]="''">
      <img src="assets/images/logo.png" alt="The Ideal Kids Logo" />
    </a>
  </div>

  <!-- Hamburger -->
  <button mat-icon-button class="menu-toggle" (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Center Menu -->
  <nav class="nav-menu">
    <a mat-button [routerLink]="'/about'" routerLinkActive="active">About Us</a>
    <a mat-button [routerLink]="'/events'" routerLinkActive="active">Events</a>
    <a mat-button [routerLink]="'/ideal-tips'" routerLinkActive="active">Ideal Tips</a>
    <a mat-button [routerLink]="'/forms'" routerLinkActive="active">Forms</a>

    <!-- Mobile Actions -->
    <div class="mobile-actions">
      @if (!isLoggedIn) {
        <button mat-button routerLink="/login">Login</button>
        <button mat-button routerLink="/register">Signup</button>
        <button mat-raised-button color="primary" routerLink="/volunteer-signup">
          High School Volunteer Signup
        </button>
      }
    </div>
  </nav>

  <!-- Right Section (Desktop) -->
  <div class="right-section">
    @if (!isLoggedIn) {
      <button mat-button routerLink="/login">Login</button>
      <button mat-button routerLink="/register">Signup</button>
      <button mat-raised-button color="primary" routerLink="/volunteer-signup">
        High School Volunteer Signup
      </button>
    }

    @if (isLoggedIn) {
      <button mat-icon-button [matMenuTriggerFor]="profileMenu">
        <img src="assets/images/user.png" class="profile-img" />
      </button>

      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item>Admin</button>
        <button mat-menu-item>Profile</button>
        <button mat-menu-item routerLink="/my-events">Events</button>
        <button mat-menu-item>Current Event Info</button>
        <button mat-menu-item>Add/Edit Child</button>
        <button mat-menu-item>Change Password</button>
        <button mat-menu-item (click)="logout()">Logout</button>
      </mat-menu>
    }
  </div>
</mat-toolbar>
